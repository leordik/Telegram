name: Build Debug APK

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build afatDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK components and NDK r21e
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Inject Telegram API credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -e
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::error::APP_ID and APP_HASH repo secrets are required"
            exit 1
          fi
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          python3 - <<'PY'
          import os, re
          path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          src = open(path).read()
          src = re.sub(r'(public static int APP_ID\s*=\s*)\d+(;)', r'\g<1>' + os.environ["APP_ID"] + r'\g<2>', src, count=1)
          src = re.sub(r'(public static String APP_HASH\s*=\s*")[^"]*(";)', r'\g<1>' + os.environ["APP_HASH"] + r'\g<2>', src, count=1)
          open(path, "w").write(src)
          PY

      - name: Build afatDebug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: find_apk
        run: |
          set -e
          APK_PATH="$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" telegram-confirm-links-debug.apk
          ls -la telegram-confirm-links-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-confirm-links-debug-apk
          path: telegram-confirm-links-debug.apk
          if-no-files-found: error
          retention-days: 30
